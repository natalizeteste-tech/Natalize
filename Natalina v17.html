<style>
:root{--bg:#f7ede4;--card:#fffaf5;--ink:#2d4a3b;--mute:#6b7d70;--pine:#3e6b55;--sage:#8db097;--cin:#a5683c;--can:#ebd0b8;--line:#e6d4c4;--on:#fff;--fs:18px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0)}

.rd.sans{font-family:"Nunito Sans",system-ui,sans-serif}.pg{position:fixed;top:env(safe-area-inset-top,0);left:0;height:3px;width:0;background:var(--cin);z-index:10}

.sheet.pvw{max-height:92vh}.cd{display:flex;gap:14px;justify-content:center;margin:8px 0}.cd span{text-align:center}.cd b{display:block;font:700 28px "Cormorant Garamond",serif;color:var(--pine)}.bdg{color:var(--cin)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}.chips .btn{margin:0}.btn.ghost.on{background:var(--pine);color:var(--on);border-color:var(--pine)}
#bl{position:relative;display:flex;align-items:center}.dt{width:9px;height:9px;border-radius:50%;background:var(--cin);display:inline-block}#bl .dt{position:absolute;top:5px;right:5px}.dt.in{position:static;flex:none}
.ver{text-align:center;color:var(--mute);font-size:12px;margin:0;padding:0 0 60px}h3{font:700 19px "Cormorant Garamond",Georgia,serif;margin:16px 0 4px;color:var(--pine)}
/* menu lateral + sino e perfil */
.hl{display:flex;align-items:center;gap:10px;min-width:0}
nav{flex-wrap:nowrap;gap:8px}
.ib{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0;overflow:hidden;font:700 16px "Nunito Sans",sans-serif;text-decoration:none;cursor:pointer;position:relative}

.scr{position:relative;width:100%;height:100%;border-radius:12px;overflow:hidden}.scr.light{background:#fbfaf6;color:#1d1d1d}.scr.sepia{background:#f3e8d0;color:#40301e}.scr.dark{background:#111815;color:#d8d2c4}

/* v16 */
a{color:var(--pine);text-underline-offset:2px}a:visited{color:var(--pine)}
